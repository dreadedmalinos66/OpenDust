[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
build_flags =
    -D CORE_DEBUG_LEVEL=0
lib_deps =
    SPI
    FS
    SD

[env:cyd]
build_flags =
    ${env.build_flags}
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D SD_MOSI=23
    -D SD_MISO=19
    -D SD_SCLK=18
    -D SD_CS=5
    -D KB_SDA=27
    -D KB_SCL=22
lib_deps =
    ${env.lib_deps}
    Wire
    bodmer/TFT_eSPI @ ^2.5.43
    marian-craciunescu/ESP32Ping
